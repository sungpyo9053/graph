name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install test dependencies
        run: python -m pip install -e '.[dev,gui]'
      - name: Test
        run: python -m pytest
      - name: Lint
        if: always()
        run: python -m ruff check .
      - name: Typecheck
        if: always()
        run: python -m mypy src
