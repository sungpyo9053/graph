services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://idea:idea@db:5432/idea
      LLM_PROVIDER: fake
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: idea
      POSTGRES_USER: idea
      POSTGRES_PASSWORD: idea
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idea"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres-data:/var/lib/postgresql/data"]
volumes:
  postgres-data:
